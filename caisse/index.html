<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisse - NoSignal</title>
    <script src="/caisse-nosignal/gateway.js"></script>
    <script src="/caisse-nosignal/nav.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // CONFIGURATION : Remplace l'URL par l'URL de déploiement de ton Apps Script
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/TON_ID_DEPLOIEMENT/exec"
        };
    </script>
</head>
<body class="bg-[#1a1a1a] text-[#f5f5f5] font-sans antialiased min-h-screen relative">

    <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2"></div>

    <div id="loading-overlay" class="fixed inset-0 bg-[#111] z-50 flex flex-col items-center justify-center p-6 text-center">
        <div id="loading-box" class="max-w-md space-y-6">
            <div class="w-12 h-12 border-4 border-t-transparent border-white rounded-full animate-spin mx-auto"></div>
            <p class="text-lg text-gray-300 font-medium tracking-wide">Chargement du module de caisse...</p>
        </div>
    </div>

    <div id="dashboard-screen" class="w-full min-h-screen flex">
        <div id="sidebar-container" class="h-full shrink-0"></div>

        <main class="flex-1 bg-[#161616] flex flex-col min-w-0">
            <header class="h-16 bg-[#111] border-b border-[#222] flex items-center justify-between px-8 shrink-0">
                <div class="flex items-center space-x-4">
                    <span class="text-xs uppercase tracking-wider text-gray-400 font-semibold">Entreprise Active :</span>
                    <span id="active-company-name" class="text-white font-bold bg-[#222] px-3 py-1.5 rounded border border-[#333]">Chargement...</span>
                </div>
                <div class="text-xs text-emerald-400 bg-emerald-950/30 border border-emerald-800/50 px-3 py-1 rounded">Mode Vente Actif</div>
            </header>

            <div id="admin-actions-container"></div>
            
            <div class="flex-1 flex overflow-hidden">
                <div class="flex-1 flex flex-col p-6 overflow-y-auto space-y-6">
                    <div id="categories-container" class="flex flex-wrap gap-2 shrink-0"></div>
                    <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
                </div>

                <div class="w-96 bg-[#111] border-l border-[#222] flex flex-col justify-between shrink-0">
                    <div class="p-4 border-b border-[#222] flex justify-between items-center bg-[#141414]">
                        <h3 class="font-bold text-white tracking-wide flex items-center space-x-2"><span>🛒</span> <span>Ticket en cours</span></h3>
                        <button onclick="clearCart()" class="text-xs text-gray-500 hover:text-red-400 transition cursor-pointer">Vider</button>
                    </div>

                    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 content-start">
                        <p class="text-sm text-gray-600 text-center py-8 italic">Le panier est vide</p>
                    </div>

                    <div class="p-4 border-t border-[#222] bg-[#141414] space-y-4">
                        <div class="flex justify-between items-center border-b border-[#222] pb-3">
                            <span class="text-sm text-gray-400">Total à payer</span>
                            <span id="cart-total" class="text-2xl font-black text-emerald-400">0,00 $US</span>
                        </div>
                        <button id="btn-validate-sale" onclick="submitSale()" disabled class="w-full bg-[#222] border border-[#333] text-gray-500 py-3 rounded-lg font-bold transition uppercase tracking-wider text-sm cursor-not-allowed">
                            Enregistrer la Vente
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const sessionData = JSON.parse(localStorage.getItem('caisse_session'));
        const loadingOverlay = document.getElementById('loading-overlay');
        let dataProduitsGlobal = [];
        let cart = [];
        let activeCategory = "TOUT";
        
        function showNotification(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-6 py-3 rounded-lg text-sm font-bold shadow-lg transition-all duration-300 transform translate-x-full ${isError ? 'bg-red-600' : 'bg-emerald-600'} text-white`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full'), 10);
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-x-full'); setTimeout(() => toast.remove(), 300); }, 3000);
        }
        
        function showBlockError(message) {
            if (loadingOverlay) loadingOverlay.classList.add('hidden');
            showNotification("Erreur : " + message, true);
        }

        if (!sessionData) {
            showBlockError("Aucune session détectée.");
        } else {
            async function fetchCaisseData() {
                try {
                    const params = new URLSearchParams({
                        action: 'getCaisseData',
                        userId: sessionData.userId,
                        activeCompanyId: localStorage.getItem('active_company_id') || ''
                    });
                    const response = await fetch(CONFIG.API_URL, { method: "POST", body: params });
                    const result = await response.json();
                    if (!result.success) throw new Error(result.message);
                    dataProduitsGlobal = result.produits || [];
                    renderCategories();
                    document.getElementById('active-company-name').innerText = result.entreprises?.[0]?.nom || "N/A";
                    loadingOverlay.classList.add('hidden');
                } catch (e) { showBlockError(e.message); }
            }
            fetchCaisseData();
        }

        // --- Fonctions Panier ---
        function addToCart(productId) {
            const product = dataProduitsGlobal.find(p => p.id == productId);
            if (!product) return;
            const existing = cart.find(item => item.id == productId);
            if (existing) existing.quantite++;
            else cart.push({ ...product, quantite: 1 });
            updateCartUI();
        }

        function updateQuantity(productId, newQty) {
            const qty = parseInt(newQty, 10);
            if (isNaN(qty) || qty <= 0) { cart = cart.filter(i => i.id != productId); }
            else { const item = cart.find(i => i.id == productId); if (item) item.quantite = qty; }
            updateCartUI();
        }

        function clearCart() { cart = []; updateCartUI(); }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const btnSubmit = document.getElementById('btn-validate-sale');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-600 text-center py-8 italic">Le panier est vide</p>';
                btnSubmit.disabled = true;
                btnSubmit.className = "w-full bg-[#222] border border-[#333] text-gray-500 py-3 rounded-lg font-bold transition uppercase tracking-wider text-sm cursor-not-allowed";
            } else {
                let total = 0;
                container.innerHTML = cart.map(item => {
                    total += (item.prix * item.quantite);
                    return `
                        <div class="flex justify-between items-center text-sm bg-[#161616] p-2 rounded border border-[#222]">
                            <div class="flex-1 min-w-0 pr-2"><p class="text-white font-medium truncate">${item.nom}</p></div>
                            <div class="flex items-center space-x-3 shrink-0">
                                <input type="number" min="1" value="${item.quantite}" onchange="updateQuantity(${item.id}, this.value)" class="w-14 bg-[#222] border border-[#333] text-white text-center rounded py-1 text-xs focus:outline-none focus:border-emerald-500">
                                <button onclick="cart = cart.filter(i => i.id != ${item.id}); updateCartUI();" class="text-gray-500 hover:text-red-400 transition text-xs">✕</button>
                            </div>
                        </div>`;
                }).join('');
                btnSubmit.disabled = false;
                btnSubmit.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-bold transition uppercase tracking-wider text-sm cursor-pointer";
                totalEl.innerText = total.toFixed(2) + " $US";
            }
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            const cats = ["TOUT", ...new Set(dataProduitsGlobal.map(p => p.categorie))];
            container.innerHTML = cats.map(cat => `
                <button onclick="activeCategory='${cat}'; filterProducts('${cat}')" class="px-4 py-2 rounded text-xs font-bold transition ${activeCategory === cat ? 'bg-white text-black' : 'bg-[#222] text-white hover:bg-[#333]'}">
                    ${cat}
                </button>`).join('');
            filterProducts(activeCategory);
        }

        function filterProducts(cat) {
            const grid = document.getElementById('products-grid');
            const filtered = cat === "TOUT" ? dataProduitsGlobal : dataProduitsGlobal.filter(p => p.categorie === cat);
            grid.innerHTML = filtered.map(p => `
                <button onclick="addToCart(${p.id})" class="bg-[#222] p-4 rounded-lg text-left hover:border border-emerald-500 transition">
                    <p class="font-bold">${p.nom}</p>
                    <p class="text-emerald-400 text-sm font-semibold mt-1">${p.prix} $US</p>
                </button>`).join('');
        }

        async function submitSale() {
            const btn = document.getElementById('btn-validate-sale');
            btn.disabled = true; btn.innerText = "Enregistrement...";
            
            const params = new URLSearchParams({
                action: 'saveSale',
                data: JSON.stringify({
                    userId: sessionData.userId,
                    entrepriseId: localStorage.getItem('active_company_id'),
                    cart: cart
                })
            });

            try {
                const response = await fetch(CONFIG.API_URL, { method: "POST", body: params });
                const result = await response.json();
                if (result.success) { showNotification("Vente enregistrée !"); clearCart(); }
                else throw new Error(result.message);
            } catch (e) { showNotification(e.message, true); }
            finally { btn.disabled = false; btn.innerText = "Enregistrer la Vente"; }
        }
    </script>
</body>
</html>
