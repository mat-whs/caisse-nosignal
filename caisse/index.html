<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisse - NoSignal</title>
    <script src="/caisse-nosignal/gateway.js"></script>
    <script src="/caisse-nosignal/nav.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1a1a1a] text-[#f5f5f5] font-sans antialiased min-h-screen relative">

    <div id="loading-overlay" class="fixed inset-0 bg-[#111] z-50 flex flex-col items-center justify-center p-6 text-center">
        <div id="loading-box" class="max-w-md space-y-6">
            <div id="loading-spinner" class="w-12 h-12 border-4 border-t-transparent border-white rounded-full animate-spin mx-auto"></div>
            <p id="loading-text" class="text-lg text-gray-300 font-medium tracking-wide">
                Chargement du module de caisse...
            </p>
        </div>
    </div>

    <div id="dashboard-screen" class="w-full min-h-screen flex">
        
        <div id="sidebar-container" class="h-full shrink-0"></div>

        <main class="flex-1 bg-[#161616] flex flex-col min-w-0">
            <header class="h-16 bg-[#111] border-b border-[#222] flex items-center justify-between px-8 shrink-0">
                <div class="flex items-center space-x-4">
                    <span class="text-xs uppercase tracking-wider text-gray-4xl font-semibold">Entreprise Active</span>
                    <select id="company-selector" class="bg-[#222] border border-[#333] text-white rounded px-3 py-1.5 focus:outline-none cursor-pointer">
                        <option>Chargement...</option>
                    </select>
                </div>
                <div id="caisse-status" class="text-xs text-emerald-400 bg-emerald-950/30 border border-emerald-800/50 px-3 py-1 rounded">
                    Mode Vente Actif
                </div>
            </header>

            <div class="flex-1 flex overflow-hidden">
                
                <div class="flex-1 flex flex-col p-6 overflow-y-auto space-y-6">
                    <div id="categories-container" class="flex flex-wrap gap-2 shrink-0"></div>

                    <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
                </div>

                <div class="w-96 bg-[#111] border-l border-[#222] flex flex-col justify-between shrink-0">
                    <div class="p-4 border-b border-[#222] flex justify-between items-center bg-[#141414]">
                        <h3 class="font-bold text-white tracking-wide flex items-center space-x-2">
                            <span>🛒</span> <span>Ticket en cours</span>
                        </h3>
                        <button onclick="clearCart()" class="text-xs text-gray-500 hover:text-red-400 transition">Vider</button>
                    </div>

                    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 content-start">
                        <p id="empty-cart-text" class="text-sm text-gray-600 text-center py-8 italic">Le panier est vide</p>
                    </div>

                    <div class="p-4 border-t border-[#222] bg-[#141414] space-y-4">
                        <div class="flex justify-between items-center border-b border-[#222] pb-3">
                            <span class="text-sm text-gray-400">Total à payer</span>
                            <span id="cart-total" class="text-2xl font-black text-emerald-400">0,00 $US</span>
                        </div>
                        <button id="btn-validate-sale" onclick="submitSale()" disabled class="w-full bg-[#222] border border-[#333] text-gray-500 py-3 rounded-lg font-bold transition uppercase tracking-wider text-sm cursor-not-allowed">
                            Enregistrer la Vente
                        </button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const sessionData = JSON.parse(localStorage.getItem('caisse_session'));
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        
        let dataProduitsGlobal = [];
        let cart = [];
        let activeCategory = "TOUT";

        // Sécurité anti-blocage : Si l'API met plus de 10 secondes, on affiche un bouton d'action
        const timeoutSecurity = setTimeout(() => {
            if (!loadingOverlay.classList.contains('hidden') && loadingSpinner) {
                showBlockError("Le serveur Apps Script met du temps à répondre. Vérifiez que votre script Google Sheets est bien publié ou essayez à nouveau.");
            }
        }, 10000);

        function showBlockError(message) {
            clearTimeout(timeoutSecurity);
            if (loadingSpinner) loadingSpinner.remove();
            loadingOverlay.classList.remove('hidden');
            loadingText.innerHTML = `<span class="text-red-500 font-bold block text-xl mb-2">Problème de connexion</span>
                                     <span class="text-gray-300 text-sm block max-w-md mx-auto leading-relaxed">${message}</span>
                                     <button onclick="logoutForce()" class="mt-6 bg-[#222] hover:bg-red-900 border border-[#333] text-white text-xs px-4 py-2 rounded transition cursor-pointer">Retour</button>`;
        }

        if (!sessionData) {
            loadingOverlay.classList.remove('hidden');
            if (loadingSpinner) loadingSpinner.remove();
    
            loadingText.innerHTML = `
                <span class="text-red-500 font-bold block text-2xl mb-4">Erreur de Session</span>
                <p class="text-gray-300 text-sm mb-6">Aucune session active n'a été détectée dans votre navigateur.</p>
                <div class="bg-[#222] p-4 rounded text-xs text-left font-mono text-gray-400 overflow-x-auto">
                    DEBUG: localStorage.getItem('caisse_session') est null.
                </div>
                <button onclick="window.location.replace('../')" class="mt-6 bg-[#222] hover:bg-white hover:text-black border border-[#333] text-white px-6 py-2 rounded transition cursor-pointer">
                    Retour à la connexion
                </button>
            `;
        } else {
            async function fetchCaisseData() {
                try {
                    const response = await fetch(CONFIG.API_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "getFormData", userId: sessionData.userId })
                    });
                    const result = await response.json();
                    
                    if (result.success) {
                        clearTimeout(timeoutSecurity);
                        if (!result.entreprises || result.entreprises.length === 0) {
                            showBlockError("Vous n'avez l'autorisation pour aucune entreprise, veuillez le signaler à un administrateur.");
                            return;
                        }

                        dataProduitsGlobal = result.produits || [];
                        const compSelector = document.getElementById('company-selector');
                        compSelector.innerHTML = ""; 
                        
                        result.entreprises.forEach(entreprise => {
                            const opt = document.createElement('option');
                            opt.value = parseInt(entreprise.id);
                            // CORRECTION DE LA SYNTAXE ICI (Suppression du @ erroné)
                            opt.innerText = Math.trunc(entreprise.id) === 1 ? "Burger Shot" : entreprise.nom;
                            compSelector.appendChild(opt);
                        });

                        const savedCompany = localStorage.getItem('active_company_id');
                        if (savedCompany && [...compSelector.options].some(o => o.value === savedCompany)) {
                            compSelector.value = savedCompany;
                        }
                        
                        localStorage.setItem('active_company_id', compSelector.value);
                        renderCaisseModule(compSelector.value);

                        compSelector.addEventListener('change', () => {
                            localStorage.setItem('active_company_id', compSelector.value);
                            clearCart();
                            activeCategory = "TOUT";
                            renderCaisseModule(compSelector.value);
                        });

                        loadingOverlay.classList.add('hidden');
                    } else {
                        showBlockError(result.message || "Erreur d'autorisation.");
                    }
                } catch (error) {
                    showBlockError("Erreur de liaison réseau avec l'API Apps Script. Vérifiez votre fichier gateway.js.");
                }
            }

            fetchCaisseData();
        }

        function renderCaisseModule(companyId) {
            const currentProducts = dataProduitsGlobal.filter(p => Number(p.entrepriseId) === Number(companyId));
            
            const categories = ["TOUT", ...new Set(currentProducts.map(p => p.categorie).filter(Boolean))];
            const catContainer = document.getElementById('categories-container');
            catContainer.innerHTML = "";

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.innerText = cat;
                btn.className = `px-4 py-2 rounded-lg text-xs font-bold tracking-wider uppercase transition border cursor-pointer ${
                    activeCategory === cat 
                    ? "bg-white text-black border-white" 
                    : "bg-[#1f1f1f] text-gray-400 border-[#2e2e2e] hover:text-white hover:border-gray-500"
                }`;
                btn.onclick = () => {
                    activeCategory = cat;
                    renderCaisseModule(companyId);
                };
                catContainer.appendChild(btn);
            });

            const grid = document.getElementById('products-grid');
            grid.innerHTML = "";

            const filteredProducts = activeCategory === "TOUT" 
                ? currentProducts 
                : currentProducts.filter(p => p.categorie === activeCategory);

            if (filteredProducts.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-sm text-gray-600 italic py-12">Aucun produit ou menu disponible dans cette catégorie.</p>`;
                return;
            }

            filteredProducts.forEach(prod => {
                const card = document.createElement('div');
                card.className = "bg-[#1f1f1f] border border-[#2e2e2e] p-4 rounded-xl flex flex-col justify-between hover:border-gray-500 transition cursor-pointer group";
                card.onclick = () => addToCart(prod);
                card.innerHTML = `
                    <div>
                        <span class="text-[10px] uppercase font-bold tracking-widest text-gray-500 block mb-1">${prod.categorie}</span>
                        <h4 class="font-bold text-white text-sm group-hover:text-emerald-400 transition">${prod.nomProduit}</h4>
                    </div>
                    <div class="mt-4 pt-2 border-t border-[#2b2b2b] flex justify-between items-center">
                        <span class="text-emerald-400 font-extrabold text-base">${Number(prod.prixVente).toFixed(2)} $</span>
                        <span class="text-[10px] bg-[#292929] px-2 py-0.5 rounded text-gray-400 group-hover:bg-emerald-950 group-hover:text-emerald-400 transition">+ Ajouter</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // GESTION DU PANIER
        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({
                    id: product.id,
                    nomProduit: product.nomProduit,
                    prixVente: Number(product.prixVente),
                    quantity: 1
                });
            }
            updateCartUI();
        }

        function updateQuantity(id, amount) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.quantity += amount;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }

        function clearCart() {
            cart = [];
            updateCartUI();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearCart();
        });

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const emptyText = document.getElementById('empty-cart-text');
            const totalDisplay = document.getElementById('cart-total');
            const btnValidate = document.getElementById('btn-validate-sale');

            const lines = container.querySelectorAll('.cart-item-line');
            lines.forEach(l => l.remove());

            if (cart.length === 0) {
                emptyText.classList.remove('hidden');
                totalDisplay.innerText = "0,00 $US";
                btnValidate.disabled = true;
                btnValidate.className = "w-full bg-[#222] border border-[#333] text-gray-500 py-3 rounded-lg font-bold uppercase tracking-wider text-sm cursor-not-allowed";
                return;
            }

            emptyText.classList.add('hidden');
            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.prixVente * item.quantity;
                total += itemTotal;

                const row = document.createElement('div');
                row.className = "cart-item-line bg-[#1c1c1c] border border-[#262626] p-3 rounded-lg flex justify-between items-center text-sm";
                row.innerHTML = `
                    <div class="min-w-0 flex-1 pr-2">
                        <p class="text-white font-medium truncate">${item.nomProduit}</p>
                        <p class="text-xs text-emerald-400 font-semibold">${item.prixVente.toFixed(2)} $</p>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <button onclick="updateQuantity(${item.id}, -1)" class="w-6 h-6 bg-[#292929] hover:bg-red-950 hover:text-red-400 text-white font-bold rounded flex items-center justify-center transition cursor-pointer">-</button>
                        <span class="text-white font-bold text-xs w-6 text-center">${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)" class="w-6 h-6 bg-[#292929] hover:bg-emerald-950 hover:text-emerald-400 text-white font-bold rounded flex items-center justify-center transition cursor-pointer">+</button>
                    </div>
                `;
                container.appendChild(row);
            });

            totalDisplay.innerText = total.toFixed(2) + " $US";
            btnValidate.disabled = false;
            btnValidate.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-lg font-bold transition uppercase tracking-wider text-sm cursor-pointer shadow-lg shadow-emerald-950/20";
        }

        // ENREGISTREMENT EN BASE DE DONNÉES
        async function submitSale() {
            const btnValidate = document.getElementById('btn-validate-sale');
            const compSelector = document.getElementById('company-selector');
            
            btnValidate.disabled = true;
            btnValidate.innerText = "Traitement...";

            try {
                for (const item of cart) {
                    await fetch(CONFIG.API_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "addMouvement",
                            userId: sessionData.userId,
                            entrepriseId: compSelector.value,
                            typeAction: "Vente",
                            element: item.nomProduit,
                            quantite: item.quantity,
                            prixTotal: item.prixVente * item.quantity
                        })
                    });
                }

                alert("Vente enregistrée avec succès !");
                clearCart();
            } catch (error) {
                console.error(error);
                alert("Erreur réseau lors de la validation.");
            } finally {
                btnValidate.innerText = "Enregistrer la Vente";
                btnValidate.disabled = false;
            }
        }

        function logoutForce() {
            localStorage.removeItem('caisse_session');
            localStorage.removeItem('active_company_id');
            window.location.replace('../');
        }
    </script>
</body>
</html>
