<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisse - NoSignal</title>
    <script src="/caisse-nosignal/config.js"></script>
    <script src="/caisse-nosignal/gateway.js"></script>
    <script src="/caisse-nosignal/nav.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1a1a1a] text-[#f5f5f5] font-sans antialiased min-h-screen relative">

    <div id="loading-overlay" class="fixed inset-0 bg-[#111] z-50 flex flex-col items-center justify-center p-6 text-center">
        <div id="loading-box" class="max-w-md space-y-6">
            <div id="loading-spinner" class="w-12 h-12 border-4 border-t-transparent border-white rounded-full animate-spin mx-auto"></div>
            <p id="loading-text" class="text-lg text-gray-300 font-medium tracking-wide">
                Chargement du module de caisse...
            </p>
        </div>
    </div>

    <div id="dashboard-screen" class="w-full min-h-screen flex">
        <div id="sidebar-container" class="h-full shrink-0"></div>

        <main class="flex-1 bg-[#161616] flex flex-col min-w-0">
            <header class="h-16 bg-[#111] border-b border-[#222] flex items-center justify-between px-8 shrink-0">
                <div class="flex items-center space-x-4">
                    <span class="text-xs uppercase tracking-wider text-gray-400 font-semibold">Entreprise Active</span>
                    <select id="company-selector" class="bg-[#222] border border-[#333] text-white rounded px-3 py-1.5 focus:outline-none cursor-pointer">
                        <option>Chargement...</option>
                    </select>
                </div>
                <div id="caisse-status" class="text-xs text-emerald-400 bg-emerald-950/30 border border-emerald-800/50 px-3 py-1 rounded">
                    Mode Vente Actif
                </div>
            </header>

            <div id="admin-actions-container"></div>
            
            <div class="flex-1 flex overflow-hidden">
                <div class="flex-1 flex flex-col p-6 overflow-y-auto space-y-6">
                    <div id="categories-container" class="flex flex-wrap gap-2 shrink-0"></div>
                    <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
                </div>

                <div class="w-96 bg-[#111] border-l border-[#222] flex flex-col justify-between shrink-0">
                    <div class="p-4 border-b border-[#222] flex justify-between items-center bg-[#141414]">
                        <h3 class="font-bold text-white tracking-wide flex items-center space-x-2">
                            <span>🛒</span> <span>Ticket en cours</span>
                        </h3>
                        <button onclick="clearCart()" class="text-xs text-gray-500 hover:text-red-400 transition cursor-pointer">Vider</button>
                    </div>

                    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 content-start">
                        <p id="empty-cart-text" class="text-sm text-gray-600 text-center py-8 italic">Le panier est vide</p>
                    </div>

                    <div class="p-4 border-t border-[#222] bg-[#141414] space-y-4">
                        <div class="flex justify-between items-center border-b border-[#222] pb-3">
                            <span class="text-sm text-gray-400">Total à payer</span>
                            <span id="cart-total" class="text-2xl font-black text-emerald-400">0,00 $US</span>
                        </div>
                        <button id="btn-validate-sale" onclick="submitSale()" disabled class="w-full bg-[#222] border border-[#333] text-gray-500 py-3 rounded-lg font-bold transition uppercase tracking-wider text-sm cursor-not-allowed">
                            Enregistrer la Vente
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const sessionData = JSON.parse(localStorage.getItem('caisse_session'));
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        
        let dataProduitsGlobal = [];
        let cart = [];
        let activeCategory = "TOUT";
        let userRoleInfo = null;
        
        function showBlockError(message) {
            console.error("Erreur de module :", message);
            // On cache l'overlay même en cas d'erreur pour voir ce qui s'affiche
            loadingOverlay.classList.add('hidden');
            // On ajoute un petit indicateur visuel discret au lieu d'une page d'erreur
            const errorDiv = document.createElement('div');
            errorDiv.className = "fixed top-4 right-4 bg-red-900 text-white p-4 rounded z-50 text-sm";
            errorDiv.innerText = "Note : Problème de chargement des données.";
            document.body.appendChild(errorDiv);
        }

        // SÉCURITÉ : Pas de redirection, juste un message d'erreur
        if (!sessionData) {
            showBlockError("Aucune session détectée. Veuillez vous reconnecter.");
        } else {
            async function fetchCaisseData() {
                try {
                const formData = new FormData();
                formData.append('action', 'getCaisseData');
                formData.append('userId', sessionData.userId);
                
                const response = await fetch(CONFIG.API_URL, {
                    method: "POST",
                    body: formData // On envoie en FormData, pas en JSON
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    console.error("Erreur logique renvoyée par le serveur :", result.message);
                    showBlockError("Erreur serveur : " + result.message);
                    return;
                }
        
                // Si produits est vide, on initialise une liste vide au lieu de planter
                dataProduitsGlobal = result.produits || []; 

                const compSelector = document.getElementById('company-selector');
                if (compSelector) {
                    compSelector.innerHTML = ""; // Vide le "Chargement..."
                    
                    // Remplissage du select
                    result.entreprises.forEach(entreprise => {
                        const opt = document.createElement('option');
                        opt.value = entreprise.id;
                        opt.innerText = entreprise.nom;
                        compSelector.appendChild(opt);
                    });
                
                    // Optionnel : Restaurer la sélection précédente si elle existe
                    const savedCompany = localStorage.getItem('active_company_id');
                    if (savedCompany) compSelector.value = savedCompany;
                
                    // Sauvegarder lors d'un changement
                    compSelector.addEventListener('change', (e) => {
                        localStorage.setItem('active_company_id', e.target.value);
                    });
                }
                    
                if (dataProduitsGlobal.length === 0) {
                    console.warn("Aucun produit trouvé, mais le module continue de charger.");
                }
        
                loadingOverlay.classList.add('hidden');
                // Appel de vos fonctions de rendu ici (ex: renderCategories())
                    
            } catch (e) {
                // Affiche l'erreur technique réelle au lieu d'un message générique
                showBlockError("Détail technique : " + e.message); 
                console.error("Erreur complète :", e);
                }
            }
            fetchCaisseData();
        }

        // ... (Veuillez remettre vos fonctions renderCaisseModule, addToCart, etc. ici)
    </script>
</body>
</html>
