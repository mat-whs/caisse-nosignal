<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisse - NoSignal</title>
    <script src="/caisse-nosignal/gateway.js"></script>
    <script src="/caisse-nosignal/nav.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1a1a1a] text-[#f5f5f5] font-sans antialiased min-h-screen relative">

    <div id="loading-overlay" class="fixed inset-0 bg-[#111] z-50 flex flex-col items-center justify-center p-6 text-center">
        <div id="loading-box" class="max-w-md space-y-6">
            <div id="loading-spinner" class="w-12 h-12 border-4 border-t-transparent border-white rounded-full animate-spin mx-auto"></div>
            <p id="loading-text" class="text-lg text-gray-300 font-medium tracking-wide">
                Chargement du module de caisse...
            </p>
        </div>
    </div>

    <div id="dashboard-screen" class="w-full min-h-screen flex">
        <div id="sidebar-container" class="h-full shrink-0"></div>

        <main class="flex-1 bg-[#161616] flex flex-col min-w-0">
            <header class="h-16 bg-[#111] border-b border-[#222] flex items-center justify-between px-8 shrink-0">
                <div class="flex items-center space-x-4">
                    <span class="text-xs uppercase tracking-wider text-gray-400 font-semibold">Entreprise Active</span>
                    <select id="company-selector" class="bg-[#222] border border-[#333] text-white rounded px-3 py-1.5 focus:outline-none cursor-pointer">
                        <option>Chargement...</option>
                    </select>
                </div>
                <div id="caisse-status" class="text-xs text-emerald-400 bg-emerald-950/30 border border-emerald-800/50 px-3 py-1 rounded">
                    Mode Vente Actif
                </div>
            </header>

            <div id="admin-actions-container"></div>
            
            <div class="flex-1 flex overflow-hidden">
                <div class="flex-1 flex flex-col p-6 overflow-y-auto space-y-6">
                    <div id="categories-container" class="flex flex-wrap gap-2 shrink-0"></div>
                    <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
                </div>

                <div class="w-96 bg-[#111] border-l border-[#222] flex flex-col justify-between shrink-0">
                    <div class="p-4 border-b border-[#222] flex justify-between items-center bg-[#141414]">
                        <h3 class="font-bold text-white tracking-wide flex items-center space-x-2">
                            <span>🛒</span> <span>Ticket en cours</span>
                        </h3>
                        <button onclick="clearCart()" class="text-xs text-gray-500 hover:text-red-400 transition cursor-pointer">Vider</button>
                    </div>

                    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 content-start">
                        <p id="empty-cart-text" class="text-sm text-gray-600 text-center py-8 italic">Le panier est vide</p>
                    </div>

                    <div class="p-4 border-t border-[#222] bg-[#141414] space-y-4">
                        <div class="flex justify-between items-center border-b border-[#222] pb-3">
                            <span class="text-sm text-gray-400">Total à payer</span>
                            <span id="cart-total" class="text-2xl font-black text-emerald-400">0,00 $US</span>
                        </div>
                        <button id="btn-validate-sale" onclick="submitSale()" disabled class="w-full bg-[#222] border border-[#333] text-gray-500 py-3 rounded-lg font-bold transition uppercase tracking-wider text-sm cursor-not-allowed">
                            Enregistrer la Vente
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const sessionData = JSON.parse(localStorage.getItem('caisse_session'));
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        
        let dataProduitsGlobal = [];
        let cart = [];
        let activeCategory = "TOUT";
        let userRoleInfo = null;
        
        function showBlockError(message) {
            console.error("Erreur de module :", message);
            if (loadingOverlay) loadingOverlay.classList.add('hidden');
            const errorDiv = document.createElement('div');
            errorDiv.className = "fixed top-4 right-4 bg-red-900 text-white p-4 rounded z-50 text-sm";
            errorDiv.innerText = "Erreur : " + message;
            document.body.appendChild(errorDiv);
        }
        
        function displayEmptyState() {
            const productsGrid = document.getElementById('products-grid');
            if (productsGrid) {
                productsGrid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-500">
                        <span class="text-4xl mb-4">🛒</span>
                        <p class="text-lg font-semibold">Pas d'éléments dans la caisse</p>
                    </div>
                `;
            }
            if (loadingOverlay) loadingOverlay.classList.add('hidden');
        }

        if (!sessionData) {
            showBlockError("Aucune session détectée. Veuillez vous reconnecter.");
        } else {
            async function fetchCaisseData() {
                try {
                    const params = new URLSearchParams();
                    params.append('action', 'getCaisseData');
                    params.append('userId', sessionData.userId);
                    
                    const activeCompanyId = localStorage.getItem('active_company_id');
                    if (activeCompanyId) {
                        params.append('activeCompanyId', activeCompanyId);
                    }
                    
                    const response = await fetch(CONFIG.API_URL, {
                        method: "POST",
                        body: params
                    });
                    
                    const result = await response.json();
                    
                    if (!result.success) {
                        showBlockError("Erreur serveur : " + result.message);
                        return;
                    }

                    dataProduitsGlobal = result.produits;
                    userRoleInfo = result.userRoleInfo;
                    
                    renderCategories(); 
                    
                    function renderAdminButton() {
                        const container = document.getElementById('admin-actions-container');
                        const htmlSelector = document.getElementById('company-selector');
                        const currentCompId = htmlSelector ? htmlSelector.value : "";
                        
                        const entreprisesPatron = sessionData.entreprisesPatron ? sessionData.entreprisesPatron.split(',').map(id => id.trim()) : [];
                        const isPatronOfActive = entreprisesPatron.includes(currentCompId);
                        const isAdmin = sessionData.isAdmin === true;
                
                        if (container) {
                            container.innerHTML = ""; 
                            if (isAdmin || isPatronOfActive) {
                                const btn = document.createElement('button');
                                btn.innerText = "Panel Admin Entreprise";
                                btn.className = "m-4 bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded text-xs font-bold transition";
                                btn.onclick = () => window.location.href = '/caisse-nosignal/gestion-entreprise/';
                                container.appendChild(btn);
                            }
                        }
                    }
                    
                    if (!result.produits || result.produits.length === 0) {
                        displayEmptyState();
                        dataProduitsGlobal = [];
                    } else {
                        dataProduitsGlobal = result.produits;
                    }
            
                    const htmlSelector = document.getElementById('company-selector');
                    if (htmlSelector) {
                        htmlSelector.innerHTML = "";
                        if (result.entreprises) {
                            result.entreprises.forEach(entreprise => {
                                const opt = document.createElement('option');
                                opt.value = entreprise.id;
                                opt.innerText = $.nom || entreprise.nom; // Fallback sécurisé
                                htmlSelector.appendChild(opt);
                            });
                        }
                        
                        const savedCompany = localStorage.getItem('active_company_id');
                        if (savedCompany) htmlSelector.value = savedCompany;
                        
                        htmlSelector.addEventListener('change', () => {
                            localStorage.setItem('active_company_id', htmlSelector.value);
                            renderAdminButton();
                        });
                    }
                    
                    renderAdminButton();
                    if (loadingOverlay) loadingOverlay.classList.add('hidden');
                        
                } catch (e) {
                    showBlockError("Détail technique : " + e.message); 
                }
            }
            fetchCaisseData();
        }

        function addToCart(productId) {
            const product = dataProduitsGlobal.find(p => p.id == productId);
            if (!product) return;
        
            const existing = cart.find(item => item.id == productId);
            if (existing) {
                existing.quantite++;
            } else {
                cart.push({ ...product, quantite: 1 });
            }
            updateCartUI();
        }

        function updateQuantity(productId, newQty) {
            const qty = parseInt(newQty, 10);
            if (isNaN(qty) || qty <= 0) {
                removeFromCart(productId);
                return;
            }
            const item = cart.find(item => item.id == productId);
            if (item) {
                item.quantite = qty;
            }
            updateCartUI();
        }
        
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id != productId);
            updateCartUI();
        }
        
        function clearCart() {
            cart = [];
            updateCartUI();
        }
        
        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const btnSubmit = document.getElementById('btn-validate-sale');
            
            if (!container || !totalEl || !btnSubmit) return;
            container.innerHTML = "";
            let total = 0;
        
            if (cart.length === 0) {
                container.innerHTML = '<p id="empty-cart-text" class="text-sm text-gray-600 text-center py-8 italic">Le panier est vide</p>';
                btnSubmit.disabled = true;
                btnSubmit.className = "w-full bg-[#222] border border-[#333] text-gray-500 py-3 rounded-lg font-bold transition uppercase tracking-wider text-sm cursor-not-allowed";
            } else {
                cart.forEach(item => {
                    total += (item.prix * item.quantite);
                    container.innerHTML += `
                        <div class="flex justify-between items-center text-sm bg-[#161616] p-2 rounded border border-[#222]">
                            <div class="flex-1 min-w-0 pr-2">
                                <p class="text-white font-medium truncate">${item.nom}</p>
                                <p class="text-xs text-gray-500">${item.prix}$ / unité</p>
                            </div>
                            <div class="flex items-center space-x-3 shrink-0">
                                <input type="number" min="1" value="${item.quantite}" 
                                    onchange="updateQuantity(${item.id}, this.value)" 
                                    class="w-14 bg-[#222] border border-[#333] text-white text-center rounded py-1 text-xs focus:outline-none focus:border-emerald-500">
                                <button onclick="removeFromCart(${item.id})" class="text-gray-500 hover:text-red-400 transition text-xs">✕</button>
                            </div>
                        </div>
                    `;
                });
                btnSubmit.disabled = false;
                btnSubmit.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-bold transition uppercase tracking-wider text-sm cursor-pointer";
            }
            totalEl.innerText = total.toFixed(2) + " $US";
        }
        
        function renderCategories() {
            const container = document.getElementById('categories-container');
            if (!container) return;
            const categories = ["TOUT", ...new Set(dataProduitsGlobal.map(p => p.categorie))];
            
            container.innerHTML = categories.map(cat => `
                <button onclick="filterProducts('${cat}')" class="px-4 py-2 rounded text-xs font-bold transition ${activeCategory === cat ? 'bg-white text-black' : 'bg-[#222] text-white hover:bg-[#333]'}">
                    ${cat}
                </button>
            `).join('');
            
            filterProducts(activeCategory);
        }
        
        function filterProducts(cat) {
            activeCategory = cat;
            const grid = document.getElementById('products-grid');
            if (!grid) return;
            const filtered = cat === "TOUT" ? dataProduitsGlobal : dataProduitsGlobal.filter(p => p.categorie === cat);
            
            grid.innerHTML = filtered.map(p => `
                <button onclick="addToCart(${p.id})" class="bg-[#222] p-4 rounded-lg text-left hover:border border-emerald-500 transition">
                    <p class="font-bold">${p.nom}</p>
                    <p class="text-emerald-400 text-sm font-semibold mt-1">${p.prix} $US</p>
                </button>
            `).join('');
        }
        
        async function submitSale() {
            if (cart.length === 0) return;
            
            const htmlSelector = document.getElementById('company-selector');
            const currentCompanyId = htmlSelector ? htmlSelector.value : localStorage.getItem('active_company_id');
            
            const formData = new FormData();
            formData.append('action', 'saveSale');
            formData.append('data', JSON.stringify({
                userId: sessionData.userId,
                entrepriseId: currentCompanyId,
                cart: cart
            }));
        
            try {
                const response = await fetch(CONFIG.API_URL, { method: "POST", body: formData });
                const result = await response.json();
                
                if (result.success) {
                    alert("Vente enregistrée avec succès !");
                    clearCart();
                } else {
                    alert("Erreur : " + result.message);
                }
            } catch (e) {
                alert("Erreur technique : " + e.message);
            }
        }
    </script>
</body>
</html>
