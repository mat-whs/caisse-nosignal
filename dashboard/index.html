<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="../gateway.js"></script>
</head>
<body class="bg-[#1a1a1a] text-[#f5f5f5] font-sans antialiased min-h-screen">

    <div id="dashboard-screen" class="w-full min-h-screen flex animate-fade-in">
        
        <aside class="w-64 bg-[#111] border-r border-[#222] flex flex-col justify-between">
            <div>
                <div class="p-6 border-b border-[#222]">
                    <span class="text-xl font-bold tracking-wider text-white">Caisse.<span class="font-light">NoSignal</span></span>
                </div>
                <nav class="p-4 space-y-2">
                    <a href="#" class="flex items-center space-x-3 bg-[#222] text-white p-3 rounded font-medium transition">
                        <span>📊</span> <span>Tableau de bord</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 text-gray-4xl p-3 rounded hover:bg-[#222] hover:text-white transition">
                        <span>🛒</span> <span>Caisse</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 text-gray-4xl p-3 rounded hover:bg-[#222] hover:text-white transition">
                        <span>📦</span> <span>Stock</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 text-gray-4xl p-3 rounded hover:bg-[#222] hover:text-white transition">
                        <span>⏳</span> <span>Historique</span>
                    </a>
                </nav>
            </div>
            <div class="p-4 border-t border-[#222] flex items-center justify-between">
                <div>
                    <p id="user-display-name" class="font-bold text-white text-sm">Chargement...</p>
                    <p id="user-display-role" class="text-xs text-gray-500 uppercase tracking-wider">Rôle</p>
                </div>
                <button id="btn-logout" class="text-xs bg-[#222] hover:bg-red-900 px-3 py-1.5 rounded transition cursor-pointer">Déconnexion</button>
            </div>
        </aside>

        <main class="flex-1 bg-[#161616] flex flex-col">
            <header class="h-16 bg-[#111] border-b border-[#222] flex items-center justify-between px-8">
                <div class="flex items-center space-x-4">
                    <span class="text-xs uppercase tracking-wider text-gray-4xl font-semibold">Entreprise</span>
                    <select id="company-selector" class="bg-[#222] border border-[#333] text-white rounded px-3 py-1.5 focus:outline-none cursor-pointer">
                        <option>Chargement des entreprises...</option>
                    </select>
                </div>
            </header>

            <section class="p-8 flex-1 space-y-8 overflow-y-auto">
                <div>
                    <p id="dashboard-subtitle" class="text-xs uppercase tracking-widest text-gray-500 font-bold">Tableau de bord</p>
                    <h2 class="text-4xl font-bold text-white mt-1">Vue d'ensemble</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="bg-[#1f1f1f] p-6 rounded-lg border border-[#2e2e2e]">
                        <p class="text-xs uppercase tracking-wider text-gray-4xl font-bold border-b border-[#333] pb-2 mb-3">CA du Jour</p>
                        <p class="text-3xl font-bold text-white">0,00 $US</p>
                        <p class="text-xs text-gray-500 mt-1">0 tickets</p>
                    </div>
                    <div class="bg-[#1f1f1f] p-6 rounded-lg border border-[#2e2e2e]">
                        <p class="text-xs uppercase tracking-wider text-gray-4xl font-bold border-b border-[#333] pb-2 mb-3">CA Total</p>
                        <p class="text-3xl font-bold text-white">0,00 $US</p>
                        <p class="text-xs text-gray-500 mt-1">0 ventes</p>
                    </div>
                    <div class="bg-[#1f1f1f] p-6 rounded-lg border border-[#2e2e2e]">
                        <p class="text-xs uppercase tracking-wider text-gray-4xl font-bold border-b border-[#333] pb-2 mb-3">Tickets Aujourd'hui</p>
                        <p class="text-3xl font-bold text-white">0</p>
                    </div>
                    <div class="bg-[#1f1f1f] p-6 rounded-lg border border-[#2e2e2e]">
                        <p class="text-xs uppercase tracking-wider text-gray-4xl font-bold border-b border-[#333] pb-2 mb-3">Alertes Stock</p>
                        <p id="stock-alerts-count" class="text-3xl font-bold text-emerald-4xl">0</p>
                        <p class="text-xs text-gray-500 mt-1">≤ 5 unités</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // 1. Extraction de la session locale initialisée à la connexion
        const sessionData = JSON.parse(localStorage.getItem('caisse_session'));
        
        if (sessionData) {
            document.getElementById('user-display-name').innerText = sessionData.username;
            document.getElementById('user-display-role').innerText = sessionData.permissions.includes("Admin") ? "Administrateur" : "Employé";
            
            // Stockage local global des données reçues pour éviter les appels réseaux répétitifs
            let dataStocks Global = [];
            let dataProduitsGlobal = [];

            // 2. Requête API synchrone vers getFormData
            async function fetchDashboardData() {
                try {
                    const response = await fetch(CONFIG.API_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "getFormData",
                            userId: sessionData.userId
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        dataStocksGlobal = result.stocks;
                        dataProduitsGlobal = result.produits;
                        
                        // Remplissage du sélecteur d'entreprises avec les vrais noms (Burger Shot, Vigneron...)
                        const compSelector = document.getElementById('company-selector');
                        compSelector.innerHTML = ""; 
                        
                        if (result.entreprises && result.entreprises.length > 0) {
                            result.entreprises.forEach(entreprise => {
                                const opt = document.createElement('option');
                                opt.value = entreprise.id; // ID numérique (ex: 1)
                                opt.innerText = entreprise.nom; // Nom textuel (ex: "Burger Shot")
                                compSelector.appendChild(opt);
                            });
                            
                            // Premier rendu de l’interface avec la première entreprise de la liste
                            renderCompanyData(compSelector.value, compSelector.options[compSelector.selectedIndex].text);
                        } else {
                            compSelector.innerHTML = "<option value=''>Aucune entreprise assignée</option>";
                        }

                        // Écouteur d'événement sur le changement d'entreprise active
                        compSelector.addEventListener('change', () => {
                            renderCompanyData(compSelector.value, compSelector.options[compSelector.selectedIndex].text);
                        });

                    } else {
                        console.error("Erreur d'extraction : ", result.message);
                    }
                } catch (error) {
                    console.error("Erreur de communication API : ", error);
                }
            }

            // 3. Traitement et filtrage dynamique des données de l'entreprise sélectionnée
            function renderCompanyData(companyId, companyName) {
                // Mise à jour du sous-titre
                document.getElementById('dashboard-subtitle').innerText = "Tableau de bord • " + companyName;
                
                // Filtrage des stocks appartenant uniquement à l'entreprise sélectionnée
                const stockFiltre = dataStocksGlobal.filter(item => Number(item.entrepriseId) === Number(companyId));
                // Filtrage des produits appartenant uniquement à l'entreprise sélectionnée
                const produitsFiltre = dataProduitsGlobal.filter(item => Number(item.entrepriseId) === Number(companyId));
                
                // Calcul automatique des alertes de stock (Quantité inférieure ou égale à 5)
                const alertesCount = stockFiltre.filter(item => Number(item.quantite) <= 5).length;
                document.getElementById('stock-alerts-count').innerText = alertesCount;
                
                // Les variables stockFiltre et produitsFiltre sont prêtes pour alimenter vos futurs modules de caisse et inventaires
                console.log(`[Données chargées] Entreprise : ${companyName} (ID: ${companyId})`, {
                    stocks: stockFiltre,
                    produits: produitsFiltre
                });
            }

            // Lancement automatique du chargement des données métier au chargement de la page
            fetchDashboardData();
        }

        // Gestion propre de la déconnexion
        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('caisse_session'); 
            window.location.replace('../'); 
        });
    </script>
</body>
</html>
