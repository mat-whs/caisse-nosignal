<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord - NoSignal</title>
    <script src="/caisse-nosignal/gateway.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1a1a1a] text-[#f5f5f5] font-sans antialiased min-h-screen relative">

    <div id="loading-overlay" class="fixed inset-0 bg-[#111] z-50 flex flex-col items-center justify-center p-6 text-center">
        <div id="loading-box" class="max-w-md space-y-6">
            <div id="loading-spinner" class="w-12 h-12 border-4 border-t-transparent border-white rounded-full animate-spin mx-auto"></div>
            <p id="loading-text" class="text-lg text-gray-300 font-medium tracking-wide">
                Chargement du tableau de bord...
            </p>
        </div>
    </div>

    <div id="dashboard-screen" class="w-full min-h-screen flex">
        
        <div id="sidebar-container" class="h-full shrink-0"></div>

        <main class="flex-1 bg-[#161616] flex flex-col min-w-0">
            <header class="h-16 bg-[#111] border-b border-[#222] flex items-center justify-between px-8 shrink-0">
                <div class="flex items-center space-x-4">
                    <span class="text-xs uppercase tracking-wider text-gray-400 font-semibold">Entreprise Active</span>
                    <select id="company-selector" class="bg-[#222] border border-[#333] text-white rounded px-3 py-1.5 focus:outline-none cursor-pointer">
                        <option>Chargement...</option>
                    </select>
                </div>
                <div class="text-xs text-gray-400 bg-[#222] px-3 py-1 rounded">
                    Vue d'ensemble
                </div>
            </header>

            <div class="flex-1 p-8 overflow-y-auto space-y-8">
                <div>
                    <h2 class="text-2xl font-black tracking-wide text-white">Tableau de bord</h2>
                    <p class="text-sm text-gray-500 mt-1">Consultez l'activité et l'état des comptes de votre établissement.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-[#111] border border-[#222] p-6 rounded-xl">
                        <p class="text-xs uppercase font-bold text-gray-500 tracking-wider">Chiffre d'Affaires (Ventes)</p>
                        <p id="stat-ca" class="text-3xl font-black text-emerald-400 mt-2">0,00 $</p>
                    </div>
                    <div class="bg-[#111] border border-[#222] p-6 rounded-xl">
                        <p class="text-xs uppercase font-bold text-gray-500 tracking-wider">Transactions enregistrées</p>
                        <p id="stat-transactions" class="text-3xl font-black text-white mt-2">0</p>
                    </div>
                    <div class="bg-[#111] border border-[#222] p-6 rounded-xl">
                        <p class="text-xs uppercase font-bold text-gray-500 tracking-wider">Primes Collaborateurs</p>
                        <p id="stat-primes" class="text-3xl font-black text-blue-400 mt-2">0,00 $</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const sessionData = JSON.parse(localStorage.getItem('caisse_session'));
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const loadingSpinner = document.getElementById('loading-spinner');

        // Sécurité anti-blocage : Si l'API met plus de 10 secondes, on débloque l'interface
        const timeoutSecurity = setTimeout(() => {
            if (!loadingOverlay.classList.contains('hidden') && loadingSpinner) {
                showBlockError("Le serveur Apps Script met trop de temps à répondre. Vérifiez le déploiement ou l'état de votre connexion.");
            }
        }, 10000);

        function showBlockError(message) {
            clearTimeout(timeoutSecurity);
            if (loadingSpinner) loadingSpinner.remove();
            loadingOverlay.classList.remove('hidden');
            loadingText.innerHTML = `<span class="text-red-500 font-bold block text-xl mb-2">Problème de connexion</span>
                                     <span class="text-gray-300 text-sm block max-w-md mx-auto leading-relaxed">${message}</span>
                                     <button onclick="logoutForce()" class="mt-6 bg-[#222] hover:bg-red-900 border border-[#333] text-white text-xs px-4 py-2 rounded transition cursor-pointer">Retour</button>`;
        }

        if (!sessionData) {
            window.location.replace('../');
        } else {
            async function fetchDashboardData() {
    try {
        // --- MODIFICATION ICI : Utilisation de FormData ---
        const formData = new FormData();
        formData.append('action', 'getDashboardData');
        formData.append('userId', sessionData.userId);

        const response = await fetch(CONFIG.API_URL, {
            method: "POST",
            body: formData
        });
        
        const result = await response.json();

        if (result.success) {
            clearTimeout(timeoutSecurity);
            
            // ... (gardez tout votre code existant pour le compSelector et le rendu ici) ...
            
            const compSelector = document.getElementById('company-selector');
            compSelector.innerHTML = "";
            result.entreprises.forEach(entreprise => {
                const opt = document.createElement('option');
                opt.value = parseInt(entreprise.id);
                opt.innerText = entreprise.nom; // Assurez-vous que votre script renvoie bien le nom
                compSelector.appendChild(opt);
            });

            // ... (fin de votre code existant) ...
            loadingOverlay.classList.add('hidden');
        } else {
            showBlockError(result.message || "Erreur d'autorisation.");
        }
    } catch (error) {
        showBlockError("Erreur de liaison réseau. Vérifiez votre configuration.");
    }
}

            fetchDashboardData();
        }

        function logoutForce() {
            localStorage.removeItem('caisse_session');
            localStorage.removeItem('active_company_id');
            window.location.replace('../');
        }
    </script>

    <script src="/caisse-nosignal/nav.js"></script>
    
</body>
</html>
