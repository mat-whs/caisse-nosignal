<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord - NoSignal</title>
    <script src="/caisse-nosignal/gateway.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Personnalisation de la barre de défilement pour la zone des ventes */
        .scroll-zone::-webkit-scrollbar { width: 6px; }
        .scroll-zone::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#1a1a1a] text-[#f5f5f5] font-sans antialiased min-h-screen relative">

    <div id="loading-overlay" class="fixed inset-0 bg-[#111] z-50 flex flex-col items-center justify-center p-6 text-center">
        <div id="loading-box" class="max-w-md space-y-6">
            <div id="loading-spinner" class="w-12 h-12 border-4 border-t-transparent border-white rounded-full animate-spin mx-auto"></div>
            <p id="loading-text" class="text-lg text-gray-300 font-medium tracking-wide">Chargement...</p>
        </div>
    </div>

    <div id="dashboard-screen" class="w-full min-h-screen flex">
        <div id="sidebar-container" class="h-full shrink-0"></div>

        <main class="flex-1 bg-[#161616] flex flex-col min-w-0">
            <div class="flex-1 p-8 overflow-y-auto space-y-8">
                <div>
                    <h2 class="text-2xl font-black tracking-wide text-white">Tableau de bord</h2>
                    <p class="text-sm text-gray-500 mt-1">Vue d'ensemble de votre activité hebdomadaire.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-[#111] border border-[#222] p-6 rounded-xl">
                        <p class="text-xs uppercase font-bold text-gray-500 tracking-wider">CA Hebdo (Ventes)</p>
                        <p id="stat-ca" class="text-3xl font-black text-emerald-400 mt-2">0,00 $</p>
                    </div>
                    <div class="bg-[#111] border border-[#222] p-6 rounded-xl">
                        <p class="text-xs uppercase font-bold text-gray-500 tracking-wider">Primes Hebdo</p>
                        <p id="stat-primes" class="text-3xl font-black text-blue-400 mt-2">0,00 $</p>
                    </div>
                    <div class="bg-[#111] border border-[#222] p-6 rounded-xl">
                        <p class="text-xs uppercase font-bold text-gray-500 tracking-wider">Transactions</p>
                        <p id="stat-transactions" class="text-3xl font-black text-white mt-2">0</p>
                    </div>
                </div>

                <div class="bg-[#111] border border-[#222] rounded-xl flex flex-col">
                    <div class="p-6 border-b border-[#222] flex justify-between items-center">
                        <h3 class="font-bold text-lg">Détail des ventes de la semaine</h3>
                        <span class="text-xs text-gray-500 bg-[#1a1a1a] px-2 py-1 rounded">Historique détaillé</span>
                    </div>
                    <div class="scroll-zone min-h-[200px] max-h-[400px] overflow-y-auto p-6">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead class="text-gray-500 uppercase text-xs">
                                <tr>
                                    <th class="pb-4">Date</th>
                                    <th class="pb-4">Produit</th>
                                    <th class="pb-4 text-right">Total</th>
                                </tr>
                            </thead>
                            <tbody id="ventes-list" class="text-gray-300">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const sessionData = JSON.parse(localStorage.getItem('caisse_session'));
        const activeCompanyId = localStorage.getItem('active_company_id');

        async function initDashboard() {
            if (!sessionData || !activeCompanyId) return logoutForce();
        
            try {
                // Remplacement de FormData par URLSearchParams pour correspondre à la caisse
                const params = new URLSearchParams({
                    action: 'getWeeklyStats',
                    userId: sessionData.userId,
                    activeCompanyId: activeCompanyId
                });
        
                // Requête fetch mise en conformité avec le comportement attendu par Apps Script
                const response = await fetch(CONFIG.API_URL, { 
                    method: "POST", 
                    body: params
                });
                
                const result = await response.json();
        
                if (result.success) {
                    document.getElementById('stat-ca').innerText = (result.ca || 0).toFixed(2) + " $";
                    document.getElementById('stat-primes').innerText = (result.primes || 0).toFixed(2) + " $";
                    document.getElementById('stat-transactions').innerText = result.ventes.length || 0;
        
                    const list = document.getElementById('ventes-list');
                    if (result.ventes.length === 0) {
                        list.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-500 italic">Aucune vente cette semaine</td></tr>`;
                    } else {
                        list.innerHTML = result.ventes.map(v => `
                            <tr class="border-t border-[#222]">
                                <td class="py-3">${v.date}</td>
                                <td class="py-3">${v.element}</td>
                                <td class="py-3 text-right text-emerald-400 font-bold">${Number(v.total).toFixed(2)} $</td>
                            </tr>
                        `).join('');
                    }
        
                    document.getElementById('loading-overlay').classList.add('hidden');
                } else {
                    showBlockError(result.message);
                }
            } catch (e) {
                console.error("Erreur Dashboard :", e);
                showBlockError("Erreur de connexion serveur ou format de données invalide.");
            }
        }

        function showBlockError(m) { /* ... ta fonction erreur existante ... */ }
        function logoutForce() { localStorage.clear(); window.location.replace('/caisse-nosignal/'); }

        initDashboard();
    </script>
    <script src="/caisse-nosignal/nav.js"></script>
</body>
</html>
