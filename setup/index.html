<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration de votre compte - NoSignal</title>
    <script src="/caisse-nosignal/gateway.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1a1a1a] text-[#f5f5f5] font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="bg-[#111] p-8 rounded-xl shadow-2xl w-full max-w-md border border-[#222] space-y-6">
        <div class="space-y-2 text-center">
            <h1 class="text-xl font-black uppercase tracking-wider text-white">Initialisation du compte</h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest">Sécurité & Accès</p>
        </div>

        <div id="status-box" class="bg-[#161616] border border-[#222] p-4 rounded-lg text-center">
            <p class="text-sm text-gray-400" id="welcome-msg">Vérification de la validité du lien...</p>
        </div>

        <form id="setup-form" class="hidden space-y-4">
            <div>
                <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Nouveau mot de passe</label>
                <input type="password" id="new-password" required placeholder="••••••••••••" class="w-full bg-[#1c1c1c] border border-[#333] text-white rounded p-3 text-sm focus:outline-none focus:border-gray-500">
            </div>

            <div>
                <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Confirmer le mot de passe</label>
                <input type="password" id="confirm-password" required placeholder="••••••••••••" class="w-full bg-[#1c1c1c] border border-[#333] text-white rounded p-3 text-sm focus:outline-none focus:border-gray-500">
            </div>

            <button type="submit" class="w-full bg-white hover:bg-gray-200 text-black font-black text-sm py-3 rounded transition cursor-pointer uppercase tracking-wider">
                Valider et Activer
            </button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const welcomeMsg = document.getElementById('welcome-msg');
        const setupForm = document.getElementById('setup-form');

        // Fonction de hachage SHA-512 côté client via l'API Web Crypto native
        async function hashClientPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Validation immédiate du jeton au chargement
        if (!token) {
            showError("Jeton de configuration absent ou invalide.");
        } else {
            verifyToken();
        }

        async function verifyToken() {
            try {
                const formData = new FormData();
                formData.append('action', 'getUserSetupInfo');
                formData.append('token', token);

                const response = await fetch(CONFIG.API_URL, {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    welcomeMsg.innerHTML = `Bonjour <span class="text-white font-bold">${result.identifiant}</span>, définissez votre mot de passe pour accéder à votre espace NoSignal.`;
                    setupForm.classList.remove('hidden');
                } else {
                    showError(result.message || "Lien d'initialisation expiré.");
                }
            } catch (error) {
                showError("Erreur réseau lors de la validation du lien.");
            }
        }

        document.getElementById('setup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const pass = document.getElementById('new-password').value;
            const confirmPass = document.getElementById('confirm-password').value;

            if (pass.length < 4) {
                alert("Le mot de passe doit contenir au moins 4 caractères.");
                return;
            }

            if (pass !== confirmPass) {
                alert("Les mots de passe ne correspondent pas.");
                return;
            }

            try {
                // Hachage du mot de passe côté client avant l'envoi réseau
                const hashedPass = await hashClientPassword(pass);

                const formData = new FormData();
                formData.append('action', 'completeSetupPassword');
                formData.append('token', token);
                formData.append('motDePasse', hashedPass); // Envoi de la valeur hachée

                const response = await fetch(CONFIG.API_URL, {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    setupForm.remove();
                    document.getElementById('status-box').className = "bg-emerald-950/40 border border-emerald-500/30 p-4 rounded-lg text-center";
                    welcomeMsg.innerHTML = `<span class="text-emerald-400 font-bold block mb-1">Compte configuré !</span> Vous pouvez maintenant fermer cette page et vous connecter.`;
                } else {
                    alert(result.message || "Une erreur est survenue.");
                }
            } catch (error) {
                alert("Erreur réseau lors de la mise à jour.");
            }
        });

        function showError(message) {
            document.getElementById('status-box').className = "bg-red-950/40 border border-red-500/30 p-4 rounded-lg text-center";
            welcomeMsg.innerHTML = `<span class="text-red-500 font-bold block mb-1">Lien Invalide</span> <span class="text-xs text-gray-400">${message}</span>`;
        }
    </script>
</body>
</html>
