<div class="p-8 space-y-8">
    <section class="bg-[#111] p-6 rounded-xl border border-[#222]">
        <h3 class="text-xl font-bold mb-4">Gestion Équipe</h3>
        <button class="bg-blue-600 px-4 py-2 rounded text-sm font-bold">Générer un lien d'invitation</button>
        <div id="links-container" class="mt-4 text-xs font-mono text-gray-500"></div>
    </section>

    <section class="bg-[#111] p-6 rounded-xl border border-[#222]">
        <h3 class="text-xl font-bold mb-4">Ajouter au Stock</h3>
        <input type="text" id="stock-name" placeholder="Nom élément" class="bg-[#222] p-2 rounded">
        <button onclick="addStock()" class="bg-emerald-600 px-4 py-2 rounded">Ajouter Stock</button>
    </section>

    <section class="bg-[#111] p-6 rounded-xl border border-[#222]">
        <h3 class="text-xl font-bold mb-4">Ajouter Produit en Caisse</h3>
        <select id="stock-reference" class="bg-[#222] p-2 rounded"></select>
        <button onclick="addProduct()" class="bg-purple-600 px-4 py-2 rounded">Ajouter à la Caisse</button>
    </section>
</div>
