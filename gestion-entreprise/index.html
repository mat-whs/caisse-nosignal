<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Entreprise - NoSignal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/caisse-nosignal/gateway.js"></script>
    <script src="/caisse-nosignal/nav.js"></script>
    
    <style>
        /* Cette classe force la taille identique et active le scroll vertical */
        .scroll-zone {
            height: 500px; /* Ajustez cette valeur selon vos besoins */
            min-height: 500px;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-[#1a1a1a] text-white min-h-screen flex">

    <div id="sidebar-container" class="h-full shrink-0"></div>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6 p-8 bg-[#161616]">
        <div class="bg-[#1a1a1a] p-4 rounded border border-[#222]">
            <h3 class="font-bold mb-4 text-blue-400">Section Stock</h3>
            <div id="stock-container" class="scroll-zone">
                </div>
        </div>
    
        <div class="bg-[#1a1a1a] p-4 rounded border border-[#222]">
            <h3 class="font-bold mb-4 text-emerald-400">Section Produits</h3>
            <div id="produits-container" class="scroll-zone">
                </div>
        </div>
    
        <div class="bg-[#1a1a1a] p-4 rounded border border-[#222]">
            <h3 class="font-bold mb-4 text-purple-400">Section Menus</h3>
            <div id="menus-container" class="scroll-zone">
                </div>
        </div>
    </main>

    <script>
        const sessionData = JSON.parse(localStorage.getItem('caisse_session'));
        const activeCompanyId = localStorage.getItem('active_company_id');

        let localStock = []; 
        let localProducts = [];
        let selectedIngredients = [];

        if (!sessionData || !activeCompanyId) {
            window.location.replace('/caisse-nosignal/');
        }

        // --- AFFICHAGE DYNAMIQUE FORMULAIRE STOCK ---
        document.getElementById('stock-is-productible').addEventListener('change', (e) => {
            document.getElementById('prod-prime-block').classList.toggle('hidden', !e.target.checked);
        });
        document.getElementById('stock-is-recoltable').addEventListener('change', (e) => {
            document.getElementById('recolte-prime-block').classList.toggle('hidden', !e.target.checked);
        });

        // =========================================================================
        // CHARGEMENTS ET AFFICHAGES BDD
        // =========================================================================

        async function loadStockOptions() {
            try {
                const formData = new FormData();
                formData.append('userId', sessionData.userId);
                formData.append('action', 'getStockData');
                formData.append('userId', sessionData.userId);
                formData.append('activeCompanyId', activeCompanyId);

                const response = await fetch(CONFIG.API_URL, { method: "POST", body: formData });
                const result = await response.json();

                if (result.success && result.stocks) {
                    localStock = result.stocks;
                    
                    // Remplir le selecteur de composition de menu
                    const selector = document.getElementById('stock-selector');
                    const container = document.getElementById('stock-list-container');

                    // Remplir la table de gestion complète du stock
                    const tbody = document.getElementById('stock-items-table-body');
                    if(localStock.length === 0) {
                        container.innerHTML = `<p class="text-sm text-gray-500 text-center py-4 italic">Stock vide.</p>`;
                    } else {
                        container.innerHTML = localStock.map(s => `
                            <button type="button" onclick="addIngredientToMenu(${s.id})" class="w-full text-left bg-[#222] hover:bg-[#333] p-2 rounded text-sm text-white flex justify-between items-center transition border border-transparent hover:border-blue-500">
                                <span>${s.nom} <span class="text-gray-500 text-xs font-semibold">(${s.type})</span></span>
                                <span class="text-blue-400 font-bold">${(s.prixUnitaire || 0).toFixed(2)} $US</span>
                            </button>
                        `).join('');
                    }

                    tbody.innerHTML = localStock.map(s => `
                        <tr class="border-b border-[#222] hover:bg-[#141414] transition">
                            <td class="p-4 text-xs font-semibold uppercase text-gray-500">${s.type}</td>
                            <td class="p-4 text-white font-medium">${s.nom}</td>
                            <td class="p-4 text-gray-300">${(s.prixUnitaire || 0).toFixed(2)} $US</td>
                            <td class="p-4 text-xs">${s.productible === 'oui' ? `✅ (${s.primeProduction || 0} $)` : '❌'}</td>
                            <td class="p-4 text-xs">${s.recoltable === 'oui' ? `✅ (${s.primeRecolte || 0} $)` : '❌'}</td>
                            <td class="p-4 text-center space-x-2">
                                <button onclick="setupEditStock(${s.id})" class="text-xs bg-blue-950/40 border border-blue-900 text-blue-400 px-2 py-1 rounded hover:bg-blue-900 hover:text-white transition cursor-pointer">Modifier</button>
                                <button onclick="deleteStockItem(${s.id})" class="text-xs bg-red-950/40 border border-red-900 text-red-400 px-2 py-1 rounded hover:bg-red-900 hover:text-white transition cursor-pointer">Supprimer</button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                document.getElementById('stock-selector').innerHTML = '<option value="">Erreur de chargement du stock</option>';
            }
        }

        async function loadCompanyProducts() {
            const tbody = document.getElementById('products-table-body');
            try {
                const formData = new FormData();
                formData.append('action', 'getCaisseData');
                formData.append('userId', sessionData.userId);
                formData.append('activeCompanyId', activeCompanyId);

                const response = await fetch(CONFIG.API_URL, { method: "POST", body: formData });
                const result = await response.json();

                if (result.success && result.produits) {
                    localProducts = result.produits;
                    if (localProducts.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500 italic">Aucun produit configuré.</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = localProducts.map(p => `
                        <tr class="border-b border-[#222] hover:bg-[#141414] transition">
                            <td class="p-4 font-semibold text-gray-400 text-xs">${p.categorie || 'Général'}</td>
                            <td class="p-4 text-white font-medium">${p.nom}</td>
                            <td class="p-4 text-xs text-gray-500">${p.composants || 'Aucun'}</td>
                            <td class="p-4 text-emerald-400 font-bold">${p.prix.toFixed(2)} $US</td>
                            <td class="p-4 text-xs text-blue-400">${p.valeurPrime ? p.valeurPrime + ' (' + p.typePrime + ')' : 'Aucune'}</td>
                            <td class="p-4 text-center space-x-2">
                                <button onclick="setupEditProduct(${p.id})" class="text-xs bg-emerald-950/40 border border-emerald-900 text-emerald-400 px-2 py-1 rounded hover:bg-emerald-900 hover:text-white transition cursor-pointer">Modifier</button>
                                <button onclick="deleteProduct(${p.id})" class="text-xs bg-red-950/40 border border-red-900 text-red-400 px-2 py-1 rounded hover:bg-red-900 hover:text-white transition cursor-pointer">Supprimer</button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500">Erreur de chargement.</td></tr>`;
            }
        }

        // =========================================================================
        // LOGIQUE DE COMPOSITION DES ARTICLES (PRODUITS)
        // =========================================================================

        function addIngredientToMenu(stockId) {
            const targetItem = localStock.find(s => s.id === stockId);
            if (!targetItem) return;
        
            const existing = selectedIngredients.find(i => i.id === stockId);
            if (existing) {
                existing.qty += 1;
            } else {
                selectedIngredients.push({
                    id: targetItem.id,
                    nom: targetItem.nom,
                    qty: 1,
                    prixUnitaire: targetItem.prixUnitaire || 0
                });
            }
            renderIngredients();
        }
        
        function updateIngredientQty(id, newQty) {
            const qty = parseFloat(newQty, 10);
            if (isNaN(qty) || qty <= 0) { 
                removeIngredient(id); 
            } else { 
                const item = selectedIngredients.find(i => i.id === id); 
                if (item) item.qty = qty; 
                renderIngredients(); 
            }
        }

        
        function removeIngredient(id) {
            selectedIngredients = selectedIngredients.filter(i => i.id !== id);
            renderIngredients();
        }

        function renderIngredients() {
            const tbody = document.getElementById('ingredients-list-body');
            if (selectedIngredients.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-600 italic">Aucun ingrédient rattaché.</td></tr>`;
                calculateFinancials();
                return;
            }

            tbody.innerHTML = selectedIngredients.map(i => `
                <tr class="border-b border-[#222]">
                    <td class="py-2 text-white font-medium">${i.nom}</td>
                    <td class="py-2 text-center">
                        <input type="number" step="0.1" min="0.1" value="${i.qty}" onchange="updateIngredientQty(${i.id}, this.value)" class="w-14 bg-[#222] border border-[#333] text-white text-center rounded py-1 text-xs focus:outline-none focus:border-blue-500">
                    </td>
                    <td class="py-2 text-right text-gray-500">${(i.prixUnitaire || 0).toFixed(2)} $US</td>
                    <td class="py-2 text-right text-emerald-500 font-medium">${((i.prixUnitaire || 0) * i.qty).toFixed(2)} $US</td>
                    <td class="py-2 text-center">
                        <button type="button" onclick="removeIngredient(${i.id})" class="text-red-400 hover:text-red-500">❌</button>
                    </td>
                </tr>
            `).join('');
            calculateFinancials();
        }

        function calculateFinancials() {
            const price = parseFloat(document.getElementById('prod-price').value) || 0;
            const primeType = document.getElementById('prod-prime-type').value;
            const primeVal = parseFloat(document.getElementById('prod-prime-value').value) || 0;

            const totalIngredientsCost = selectedIngredients.reduce((acc, curr) => acc + ((curr.prixUnitaire || 0) * curr.qty), 0);
            
            let computedPrime = 0;
            if (primeType === "Fixe") computedPrime = primeVal;
            else if (primeType === "Pourcentage") computedPrime = price * (primeVal / 100);

            const margin = price - totalIngredientsCost - computedPrime;

            document.getElementById('summary-cost').innerText = `${totalIngredientsCost.toFixed(2)} $US`;
            document.getElementById('summary-prime').innerText = `${computedPrime.toFixed(2)} $US`;

            const marginElement = document.getElementById('summary-margin');
            marginElement.innerText = `${margin.toFixed(2)} $US`;

            if (margin >= 0) marginElement.className = "text-base font-black text-emerald-400";
            else marginElement.className = "text-base font-black text-red-500";
        }

        document.getElementById('prod-price').addEventListener('input', calculateFinancials);
        document.getElementById('prod-prime-type').addEventListener('change', calculateFinancials);
        document.getElementById('prod-prime-value').addEventListener('input', calculateFinancials);

        // =========================================================================
        // ACTIONS ET SOUMISSIONS FORMULAIRES (PRODUITS ET STOCKS)
        // =========================================================================

        // Soumission Produit (Ajout ou Modification)
        document.getElementById('form-add-product').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit-prod-id').value;
            const componentsString = selectedIngredients.map(i => `${i.nom}:${i.qty}`).join(', ');
            
            const formData = new FormData();
            formData.append('action', editId ? 'updateProduct' : 'addProduct');
            formData.append('userId', sessionData.userId);
            if (editId) formData.append('productId', editId);
            
            const productData = {
                entrepriseId: activeCompanyId,
                nom: document.getElementById('prod-name').value,
                categorie: document.getElementById('prod-category').value,
                prix: parseFloat(document.getElementById('prod-price').value),
                typePrime: document.getElementById('prod-prime-type').value,
                valeurPrime: parseFloat(document.getElementById('prod-prime-value').value) || 0,
                composants: componentsString
            };
            formData.append('data', JSON.stringify(productData));

            try {
                const response = await fetch(CONFIG.API_URL, { method: "POST", body: formData });
                const result = await response.json();
                if (result.success) {
                    alert(editId ? "Produit modifié !" : "Produit ajouté !");
                    resetProductForm();
                    loadCompanyProducts();
                } else alert("Erreur : " + result.message);
            } catch (err) { alert("Erreur réseau de base de données."); }
        });

        // Soumission Élément du Stock (Ajout ou Modification)
        document.getElementById('form-add-stock-item').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit-stock-id').value;
            
            const formData = new FormData();
            formData.append('action', editId ? 'updateStockItem' : 'addStockItem');
            formData.append('userId', sessionData.userId);
            if (editId) formData.append('stockId', editId);

            const stockData = {
                entrepriseId: activeCompanyId,
                nom: document.getElementById('stock-name').value,
                type: document.getElementById('stock-type').value,
                prixUnitaire: parseFloat(document.getElementById('stock-item-cost').value),
                productible: document.getElementById('stock-is-productible').checked ? 'oui' : 'non',
                primeProduction: parseFloat(document.getElementById('stock-prime-production').value) || 0,
                recoltable: document.getElementById('stock-is-recoltable').checked ? 'oui' : 'non',
                primeRecolte: parseFloat(document.getElementById('stock-prime-recolte').value) || 0,
                composants: document.getElementById('stock-item-components').value
            };
            formData.append('data', JSON.stringify(stockData));

            try {
                const response = await fetch(CONFIG.API_URL, { method: "POST", body: formData });
                const result = await response.json();
                if (result.success) {
                    alert(editId ? "Élément mis à jour dans le stock !" : "Élément ajouté au stock !");
                    resetStockForm();
                    await loadStockOptions();
                    renderIngredients(); // Met à jour les calculs de prix en direct si le coût à changé
                } else alert("Erreur : " + result.message);
            } catch (err) { alert("Erreur de liaison réseau."); }
        });

        // =========================================================================
        // CONFIGURATIONS DES MODIFICATIONS (EDITS) ET SUPPRESSIONS
        // =========================================================================

        function setupEditProduct(id) {
            const p = localProducts.find(item => item.id === id);
            if (!p) return;

            document.getElementById('edit-prod-id').value = p.id;
            document.getElementById('prod-name').value = p.nom;
            document.getElementById('prod-category').value = p.categorie;
            document.getElementById('prod-price').value = p.prix;
            document.getElementById('prod-prime-type').value = p.typePrime || 'Aucune';
            document.getElementById('prod-prime-value').value = p.valeurPrime || 0;

            selectedIngredients = [];
            if (p.composants && p.composants !== 'Aucun') {
                p.composants.split(',').forEach(compStr => {
                    const parts = compStr.trim().split(':');
                    if (parts.length === 2) {
                        const name = parts[0];
                        const qty = parseFloat(parts[1]);
                        const stockMatch = localStock.find(s => s.nom === name);
                        selectedIngredients.push({
                            id: stockMatch ? stockMatch.id : Math.random(),
                            nom: name,
                            qty: qty,
                            prixUnitaire: stockMatch ? stockMatch.prixUnitaire : 0
                        });
                    }
                });
            }
            renderIngredients();
            document.getElementById('btn-cancel-product').classList.remove('hidden');
            document.getElementById('btn-submit-product').innerText = "Mettre à jour le produit";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setupEditStock(id) {
            const s = localStock.find(item => item.id === id);
            if (!s) return;

            document.getElementById('edit-stock-id').value = s.id;
            document.getElementById('stock-name').value = s.nom;
            document.getElementById('stock-type').value = s.type;
            document.getElementById('stock-item-cost').value = s.prixUnitaire || 0;
            
            const isProd = s.productible === 'oui';
            const isRec = s.recoltable === 'oui';

            document.getElementById('stock-is-productible').checked = isProd;
            document.getElementById('stock-prime-production').value = s.primeProduction || 0;
            document.getElementById('prod-prime-block').classList.toggle('hidden', !isProd);

            document.getElementById('stock-is-recoltable').checked = isRec;
            document.getElementById('stock-prime-recolte').value = s.primeRecolte || 0;
            document.getElementById('recolte-prime-block').classList.toggle('hidden', !isRec);

            document.getElementById('stock-item-components').value = s.composants || '';

            document.getElementById('btn-cancel-stock').classList.remove('hidden');
            document.getElementById('btn-submit-stock').innerText = "Mettre à jour l'élément";
            document.getElementById('form-add-stock-item').scrollIntoView({ behavior: 'smooth' });
        }

        function resetProductForm() {
            document.getElementById('form-add-product').reset();
            document.getElementById('edit-prod-id').value = '';
            selectedIngredients = [];
            renderIngredients();
            document.getElementById('btn-cancel-product').classList.add('hidden');
            document.getElementById('btn-submit-product').innerText = "Enregistrer le produit";
        }

        function resetStockForm() {
            document.getElementById('form-add-stock-item').reset();
            document.getElementById('edit-stock-id').value = '';
            document.getElementById('prod-prime-block').classList.add('hidden');
            document.getElementById('recolte-prime-block').classList.add('hidden');
            document.getElementById('btn-cancel-stock').classList.add('hidden');
            document.getElementById('btn-submit-stock').innerText = "Enregistrer dans le stock";
        }

        document.getElementById('btn-cancel-product').addEventListener('click', resetProductForm);
        document.getElementById('btn-cancel-stock').addEventListener('click', resetStockForm);

        async function deleteProduct(productId) {
            if (!confirm("Retirer cet article définitivement de la caisse ?")) return;
            const formData = new FormData();
            formData.append('userId', sessionData.userId);
            formData.append('action', 'deleteProduct');
            formData.append('productId', productId);
            formData.append('entrepriseId', activeCompanyId);
            try {
                const response = await fetch(CONFIG.API_URL, { method: "POST", body: formData });
                const result = await response.json();
                if (result.success) loadCompanyProducts();
                else alert("Erreur: " + result.message);
            } catch (e) { alert("Erreur serveur."); }
        }

        async function deleteStockItem(stockId) {
            if (!confirm("Retirer cet élément du stock ? Cela n'effacera pas les menus existants mais faussera leurs coûts de revient.")) return;
            const formData = new FormData();
            formData.append('userId', sessionData.userId);
            formData.append('action', 'deleteStockItem');
            formData.append('stockId', stockId);
            formData.append('entrepriseId', activeCompanyId);
            try {
                const response = await fetch(CONFIG.API_URL, { method: "POST", body: formData });
                const result = await response.json();
                if (result.success) {
                    await loadStockOptions();
                    renderIngredients();
                } else alert("Erreur: " + result.message);
            } catch (e) { alert("Erreur serveur."); }
        }

        // Initialisation globale
        async function init() {
            await loadStockOptions();
            await loadCompanyProducts();
        }
        init();

        window.onload = function() {
            // Appelez ici les fonctions qui récupèrent vos données depuis Google Sheets
            // Exemple (adaptez selon vos noms de fonctions réels) :
            google.script.run.withSuccessHandler(renderStock).getStockData();
            google.script.run.withSuccessHandler(renderProduits).getProduitsData();
            google.script.run.withSuccessHandler(renderMenus).getMenusData();
        };
    
        // Exemple de fonction de rendu à adapter :
        function renderStock(data) {
            const container = document.getElementById('stock-container');
            container.innerHTML = ""; // Vider avant d'ajouter
            data.forEach(item => {
                container.innerHTML += `<div class="p-2 border-b border-[#333]">${item.nom}</div>`;
            });
        }
        
    </script>

    <div class="px-8 pt-6 flex gap-2">
    <button onclick="showSection('stock')" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm font-bold transition">Stock</button>
    <button onclick="showSection('produits')" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-600 rounded text-sm font-bold transition">Produits</button>
    <button onclick="showSection('menus')" class="px-4 py-2 bg-purple-700 hover:bg-purple-600 rounded text-sm font-bold transition">Menus</button>
</div>

<div id="main-content" class="flex-1 p-8 overflow-y-auto">
    <div id="section-stock" class="content-section">
        <h2 class="text-white">Section Stock</h2>
        </div>

    <div id="section-produits" class="content-section hidden">
        <h2 class="text-white">Section Produits</h2>
        </div>

    <div id="section-menus" class="content-section hidden">
        <h2 class="text-white">Section Menus</h2>
        </div>
</div>
    
</body>
</html>
