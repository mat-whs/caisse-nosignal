<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion - Caisse NoSignal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/caisse-nosignal/gateway.js"></script>
    <script src="/caisse-nosignal/nav.js"></script>
</head>
<body class="bg-[#1a1a1a] text-white min-h-screen flex">

    <div id="sidebar-container" class="h-full shrink-0"></div>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 bg-[#111] border-b border-[#222] flex items-center justify-between px-8 shrink-0">
            <h2 class="text-xl font-bold">Gestion Administrative</h2>
            <div class="flex space-x-2 bg-[#222] p-1 rounded-lg">
                <button onclick="showTab('equipe')" class="px-4 py-1.5 rounded text-sm font-medium bg-[#333]">Équipe</button>
                <button onclick="showTab('stock')" class="px-4 py-1.5 rounded text-sm font-medium hover:bg-[#333]">Stock</button>
                <button onclick="showTab('caisse')" class="px-4 py-1.5 rounded text-sm font-medium hover:bg-[#333]">Caisse</button>
            </div>
        </header>

        <div class="p-8 overflow-y-auto">
            <div id="tab-equipe" class="tab-content space-y-6">
                <section class="bg-[#111] p-6 rounded-xl border border-[#222]">
                    <h3 class="text-lg font-bold mb-4">Ajouter un Employé</h3>
                    <div class="flex flex-col gap-4">
                        <input type="text" id="emp-name" placeholder="Nom et Prénom de l'employé" class="bg-[#222] border border-[#333] p-2 rounded w-full">
                        <button onclick="genererLien()" class="bg-blue-600 px-4 py-2 rounded text-sm font-bold w-full hover:bg-blue-700 transition">
                            Générer lien d'invitation
                        </button>
                    </div>
                    <div id="links-container" class="mt-4 p-3 bg-[#161616] rounded border border-[#333] text-xs font-mono text-gray-400 hidden">
                        Lien généré : <span id="link-output" class="text-white break-all"></span>
                    </div>
                </section>
            </div>

            <div id="tab-stock" class="tab-content hidden space-y-6">...</div>
            <div id="tab-caisse" class="tab-content hidden space-y-6">...</div>
        </div>
    </main>

    <script>
        // Gestion des onglets
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        }

        // Logique génération lien
        function genererLien() {
            const nom = document.getElementById('emp-name').value;
            if (!nom) {
                alert("Veuillez saisir le nom et prénom.");
                return;
            }
            
            // Simulation de génération - Ici vous appellerez votre API
            const container = document.getElementById('links-container');
            const output = document.getElementById('link-output');
            const token = Math.random().toString(36).substring(7); // Token fictif
            
            output.innerText = `https://votre-site.com/setup?token=${token}&nom=${encodeURIComponent(nom)}`;
            container.classList.remove('hidden');
        }
    </script>
</body>
</html>
