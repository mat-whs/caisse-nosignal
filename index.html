<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - NoSignal</title>
    <script src="gateway.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1a1a1a] text-[#f5f5f5] font-sans antialiased min-h-screen flex items-center justify-center">

    <div id="login-screen" class="bg-[#242424] p-8 rounded-lg shadow-xl w-full max-w-md border border-[#333]">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-wider text-white">Caisse.<span class="text-gray-4xl font-light">NoSignal</span></h1>
            <p class="text-gray-4xl text-sm mt-2">Veuillez vous authentifier</p>
        </div>
        
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-4xl font-semibold mb-2">Identifiant</label>
                <input type="text" id="username" required class="w-full bg-[#1a1a1a] border border-[#444] rounded p-3 text-white focus:outline-none focus:border-gray-400 transition">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-4xl font-semibold mb-2">Mot de passe</label>
                <input type="password" id="password" required class="w-full bg-[#1a1a1a] border border-[#444] rounded p-3 text-white focus:outline-none focus:border-gray-400 transition">
            </div>
            <button type="submit" class="w-full bg-white text-black font-bold p-3 rounded hover:bg-gray-200 transition cursor-pointer">
                Se connecter
            </button>
        </form>
        <p id="login-error" class="text-red-500 text-sm text-center mt-4 hidden"></p>
    </div>

<script>
    // Fonction de hachage SHA-512 côté client via l'API Web Crypto native
    async function hashClientPassword(password) {
        const msgBuffer = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Vérifier la session dès le chargement de la page d'accueil
    const savedSession = localStorage.getItem('caisse_session');
    const activeCompanyId = localStorage.getItem('active_company_id');
    
    if (savedSession) {
        if (activeCompanyId) {
            // Si l'utilisateur est connecté ET a déjà sélectionné son entreprise
            window.location.replace('/caisse-nosignal/dashboard/');
        } else {
            // Si connecté mais n'a pas encore choisi son entreprise (ex: retour arrière forcé ou expiration locale)
            window.location.replace('/caisse-nosignal/choix-entreprise/');
        }
    }
    
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const userInp = document.getElementById('username').value;
        const passInp = document.getElementById('password').value;
        const errorTxt = document.getElementById('login-error');
        
        errorTxt.classList.add('hidden');
        
        try {
            // Hachage du mot de passe côté client avant l'envoi réseau
            const hashedPass = await hashClientPassword(passInp);
            
            const formData = new FormData();
            formData.append('action', 'login');
            formData.append('identifiant', userInp);
            formData.append('motDePasse', hashedPass);
            
            const response = await fetch(CONFIG.API_URL, {
                method: "POST",
                body: formData 
            });
            
            const result = await response.json();
            
            if (result.success) {
                // Stockage des informations d'authentification conformes à la structure lue par nav.js
                localStorage.setItem('caisse_session', JSON.stringify({
                    userId: result.userId,
                    token: result.token
                }));

                if (result.hasMultipleCompanies) {
                    // Si l'utilisateur a accès à plusieurs entreprises, redirection vers l'intermédiaire
                    window.location.replace('/caisse-nosignal/choix-entreprise/');
                } else if (result.defaultEntreprise) {
                    // Si une seule entreprise est disponible, on l'active directement et on charge le dashboard
                    localStorage.setItem('active_company_id', result.defaultEntreprise);
                    window.location.replace('/caisse-nosignal/dashboard/');
                } else {
                    // Cas d'un utilisateur sans aucune habilitation enregistrée dans le tableur
                    localStorage.clear();
                    errorTxt.innerText = "Erreur : Aucune entreprise ne vous est assignée.";
                    errorTxt.classList.remove('hidden');
                }
            } else {
                errorTxt.innerText = result.message;
                errorTxt.classList.remove('hidden');
            }
        } catch (error) {
            errorTxt.innerText = "Erreur : Connexion impossible. Vérifiez l'état de votre serveur API.";
            errorTxt.classList.remove('hidden');
            console.error(error);
        }
    });
</script>
</body>
</html>
