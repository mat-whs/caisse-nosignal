<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="gateway.js"></script>
</head>
<body class="bg-[#1a1a1a] text-[#f5f5f5] font-sans antialiased min-h-screen flex items-center justify-center">

    <div id="login-screen" class="bg-[#242424] p-8 rounded-lg shadow-xl w-full max-w-md border border-[#333]">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-wider text-white">Caisse.<span class="text-gray-4xl font-light">NoSignal</span></h1>
            <p class="text-gray-4xl text-sm mt-2">Veuillez vous authentifier</p>
        </div>
        
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-4xl font-semibold mb-2">Identifiant</label>
                <input type="text" id="username" required class="w-full bg-[#1a1a1a] border border-[#444] rounded p-3 text-white focus:outline-none focus:border-gray-400 transition">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-4xl font-semibold mb-2">Mot de passe</label>
                <input type="password" id="password" required class="w-full bg-[#1a1a1a] border border-[#444] rounded p-3 text-white focus:outline-none focus:border-gray-400 transition">
            </div>
            <button type="submit" class="w-full bg-white text-black font-bold p-3 rounded hover:bg-gray-200 transition cursor-pointer">
                Se connecter
            </button>
        </form>
        <p id="login-error" class="text-red-500 text-sm text-center mt-4 hidden"></p>
    </div>

<script>
    // Vérifier la session dès le chargement de la page d'accueil
    const savedSession = localStorage.getItem('caisse_session');
    
    if (savedSession) {
        // Si une session existe, on redirige vers le dashboard
        // Utilisez le chemin complet pour éviter les erreurs de dossier
        window.location.replace('/caisse-nosignal/dashboard/');
    }
    
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const userInp = document.getElementById('username').value;
        const passInp = document.getElementById('password').value;
        const errorTxt = document.getElementById('login-error');
        
        errorTxt.classList.add('hidden');
        
        try {
            // Envoi des données avec les termes exacts attendus par Google Apps Script
            const response = await fetch(CONFIG.API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "login",
                    identifiant: userInp,
                    motDePasse: passInp
                })
            });
            
            const result = await response.json();
            
            // Le script renvoie "success: true" ou "success: false"
            if (result.success) {
                // Sauvegarde des données de session (ID, identifiant, et IDs d'entreprises)
                localStorage.setItem('caisse_session', JSON.stringify({
                    userId: result.id,
                    username: result.identifiant,
                    roleId: result.roleId,
                    permissions: result.permissions,
                    entreprisesRaw: result.entreprises // Renvoie la chaîne d'IDs (ex: "1, 2")
                }));
                
                // Redirection vers le tableau de bord
                window.location.replace('/caisse-nosignal/dashboard/');
            } else {
                // Affiche les messages précis du script : "Mot de passe incorrect", "Utilisateur introuvable", etc.
                errorTxt.innerText = result.message;
                errorTxt.classList.remove('hidden');
            }
            
        } catch (error) {
            errorTxt.innerText = "Erreur de communication réseau.";
            errorTxt.classList.remove('hidden');
            console.error(error);
        }
    });
</script>
</body>
</html>
