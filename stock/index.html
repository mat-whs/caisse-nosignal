<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Stocks - Caisse NoSignal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/caisse-nosignal/config.js"></script>
    <script src="/caisse-nosignal/gateway.js"></script>
    <script src="/caisse-nosignal/nav.js"></script>
</head>
<body class="bg-[#1a1a1a] text-white min-h-screen flex">

    <div id="sidebar-container" class="h-full shrink-0"></div>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="p-8 border-b border-[#222] flex justify-between items-center bg-[#111]">
            <div>
                <h1 class="text-2xl font-bold">Gestion des Stocks</h1>
                <p class="text-sm text-gray-500 mt-1">Gérez les quantités et les éléments de votre établissement.</p>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-xs uppercase tracking-wider text-gray-400 font-semibold">Entreprise Active</span>
                <select id="company-selector" class="bg-[#222] border border-[#333] text-white rounded px-3 py-1.5 focus:outline-none cursor-pointer">
                    <option value="">Chargement...</option>
                </select>
            </div>
        </header>

        <div class="mb-6">
            <button onclick="addNewElement()" class="bg-blue-600 hover:bg-blue-700 border border-[#222] text-white px-4 py-2 rounded text-sm">
                + Ajouter un élément au stock
            </button>
        </div>
        
        <div class="p-8">
            <div class="bg-[#111] rounded-lg border border-[#222] overflow-hidden">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="bg-[#161616] text-gray-400 uppercase text-xs">
                        <tr>
                            <th class="p-4">Nom Élément</th>
                            <th class="p-4">Type</th>
                            <th class="p-4">Quantité</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stock-body">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="stock.js"></script>
</body>
</html>
