<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Stocks</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col">

    <header class="p-6 border-b border-[#222] flex justify-between items-center">
        <h1 class="text-2xl font-bold">Gestion des Stocks</h1>
        <a href="/caisse-nosignal/" class="text-sm text-gray-400 hover:text-white">Retour Caisse</a>
    </header>

    <main class="flex-1 p-6">
        <div class="mb-6">
            <select id="company-selector" class="bg-[#222] text-white p-2 rounded border border-[#333]">
                <option value="">Chargement des entreprises...</option>
            </select>
        </div>

        <div class="bg-[#111] rounded-lg border border-[#222] overflow-hidden">
            <table class="w-full text-left text-sm text-gray-300">
                <thead class="bg-[#161616] text-gray-400 uppercase">
                    <tr>
                        <th class="p-4">Nom Élément</th>
                        <th class="p-4">Type</th>
                        <th class="p-4">Quantité</th>
                        <th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="stock-body">
                    </tbody>
            </table>
        </div>
    </main>

    <script src="stock.js"></script>
</body>
</html>
